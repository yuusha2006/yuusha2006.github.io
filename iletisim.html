<body data-page="contact" id="top">
<div class="curtain" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
<div class="curtain-label" aria-hidden="true"></div>

<main id="main">
  <section class="page-hero">
    <div class="hero-canvas" data-scene="rings" aria-hidden="true"></div>
    <div class="wrap">
      <p class="mono crumbs"><a class="link-u" href="index.html" data-i18n="nav.home"></a> / <span class="teal" data-i18n="nav.contact"></span></p>
      <h1 class="display split" data-i18n="contact.title"></h1>
      <div class="page-hero-foot"><p class="reveal" data-i18n="contact.sub"></p><span class="mono">(05)</span></div>
    </div>
  </section>

  <section class="section hairline" style="padding-top:56px">
    <div class="wrap">
      <div class="contact-grid">
        <ul class="info-list reveal">
          <li><span class="mono" data-i18n="contact.address"></span><address data-person="address"></address></li>
          <li><span class="mono" data-i18n="contact.phone"></span><a class="link-u" data-person="phone" href="#"></a></li>
          <li><span class="mono" data-i18n="contact.whatsapp"></span><a class="link-u" data-wa href="#" target="_blank" rel="noopener"><span data-person="phone"></span> ↗</a></li>
          <li><span class="mono" data-i18n="contact.email"></span><a class="link-u" data-person="email" href="#"></a></li>
          <li><span class="mono" data-i18n="contact.social"></span><div class="chips" id="socialList" style="margin-top:6px"></div></li>
        </ul>

        <div>
          <h2 class="h2 split" style="margin-bottom:36px" data-i18n-html="contact.form"></h2>
          <form class="form" id="contactForm" novalidate>
            <input type="text" name="_honey" tabindex="-1" autocomplete="off" class="sr-only" aria-hidden="true">
            <div class="form-row">
              <div class="field">
                <input id="f-name" name="name" type="text" placeholder=" " autocomplete="name" required>
                <label for="f-name" data-i18n="form.name"></label>
                <span class="err" aria-live="polite"></span>
              </div>
              <div class="field">
                <input id="f-email" name="email" type="email" placeholder=" " autocomplete="email" required>
                <label for="f-email" data-i18n="form.email"></label>
                <span class="err" aria-live="polite"></span>
              </div>
            </div>
            <div class="field">
              <input id="f-subject" name="subject" type="text" placeholder=" " required>
              <label for="f-subject" data-i18n="form.subject"></label>
              <span class="err" aria-live="polite"></span>
            </div>
            <div class="field">
              <textarea id="f-message" name="message" placeholder=" " required></textarea>
              <label for="f-message" data-i18n="form.message"></label>
              <span class="err" aria-live="polite"></span>
            </div>
            <div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">
              <button class="btn btn--solid" type="submit"><span data-i18n="form.send"></span><svg class="arrow" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M1 7h12M8 2l5 5-5 5" stroke="currentColor" stroke-width="1.4"/></svg></button>
              <button class="btn" type="button" id="waSend"><span data-i18n="form.sendWa"></span><svg class="arrow" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M1 7h12M8 2l5 5-5 5" stroke="currentColor" stroke-width="1.4"/></svg></button>
              <p class="form-status mono" id="formStatus" role="status"></p>
            </div>
          </form>
        </div>
      </div>

      <div class="map reveal">
        <span class="map-pin mono"><span data-i18n="contact.map"></span> — <span data-person="city"></span></span>
        <iframe id="mapFrame" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Map" allowfullscreen></iframe>
      </div>
    </div>
  </section>
</main>
