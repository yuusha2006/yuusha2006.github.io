<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.8">
      <stop offset="0" stop-color="#2a2a2a"/>
      <stop offset="0.55" stop-color="#141414"/>
      <stop offset="1" stop-color="#070707"/>
    </radialGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#d0d0d0" fill-opacity="0.12"/>
    </pattern>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1e1e"/>
      <stop offset="1" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8c8c8c"/>
      <stop offset="1" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#dots)"/>

  <!-- wires -->
  <g fill="none" stroke="url(#wire)" stroke-width="3" filter="url(#glow)">
    <path d="M300 450 C 360 450, 380 300, 440 300"/>
    <path d="M300 450 C 360 450, 380 600, 440 600"/>
    <path d="M620 300 C 680 300, 700 450, 760 450"/>
    <path d="M620 600 C 680 600, 700 450, 760 450"/>
    <path d="M940 450 L 1000 450"/>
  </g>
  <!-- data pulses -->
  <g fill="#f2f2f2" filter="url(#glow)">
    <circle cx="395" cy="338" r="6"/>
    <circle cx="705" cy="420" r="6"/>
    <circle cx="975" cy="450" r="6"/>
  </g>

  <!-- node: trigger -->
  <g transform="translate(140 380)">
    <rect width="160" height="140" rx="70" ry="70" fill="url(#node)" stroke="#8c8c8c" stroke-width="2"/>
    <path d="M86 32 L58 76 L80 76 L72 108 L104 60 L82 60 Z" fill="#f2f2f2"/>
    <circle cx="160" cy="70" r="8" fill="#070707" stroke="#d0d0d0" stroke-width="2"/>
  </g>
  <text x="220" y="560" font-family="monospace" font-size="18" letter-spacing="2" fill="#a6a6a6" text-anchor="middle">TRIGGER</text>

  <!-- node: sheet -->
  <g transform="translate(440 230)">
    <rect width="180" height="140" rx="22" fill="url(#node)" stroke="#8c8c8c" stroke-width="2"/>
    <rect x="52" y="36" width="76" height="68" rx="6" fill="none" stroke="#f2f2f2" stroke-width="3"/>
    <path d="M52 58 H128 M52 80 H128 M80 36 V104" stroke="#f2f2f2" stroke-width="3"/>
    <circle cx="0" cy="70" r="8" fill="#070707" stroke="#d0d0d0" stroke-width="2"/>
    <circle cx="180" cy="70" r="8" fill="#070707" stroke="#d0d0d0" stroke-width="2"/>
  </g>
  <text x="530" y="410" font-family="monospace" font-size="18" letter-spacing="2" fill="#a6a6a6" text-anchor="middle">CONTACTS</text>

  <!-- node: template -->
  <g transform="translate(440 530)">
    <rect width="180" height="140" rx="22" fill="url(#node)" stroke="#8c8c8c" stroke-width="2"/>
    <path d="M62 40 H118 M62 60 H118 M62 80 H100" stroke="#f2f2f2" stroke-width="3" stroke-linecap="round"/>
    <text x="90" y="118" font-family="monospace" font-size="16" fill="#d0d0d0" text-anchor="middle">{{name}}</text>
    <circle cx="0" cy="70" r="8" fill="#070707" stroke="#d0d0d0" stroke-width="2"/>
    <circle cx="180" cy="70" r="8" fill="#070707" stroke="#d0d0d0" stroke-width="2"/>
  </g>
  <text x="530" y="710" font-family="monospace" font-size="18" letter-spacing="2" fill="#a6a6a6" text-anchor="middle">TEMPLATE</text>

  <!-- node: merge / code -->
  <g transform="translate(760 380)">
    <rect width="180" height="140" rx="22" fill="url(#node)" stroke="#8c8c8c" stroke-width="2"/>
    <path d="M70 50 L48 70 L70 90 M110 50 L132 70 L110 90" fill="none" stroke="#f2f2f2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="0" cy="70" r="8" fill="#070707" stroke="#d0d0d0" stroke-width="2"/>
    <circle cx="180" cy="70" r="8" fill="#070707" stroke="#d0d0d0" stroke-width="2"/>
  </g>
  <text x="850" y="560" font-family="monospace" font-size="18" letter-spacing="2" fill="#a6a6a6" text-anchor="middle">PERSONALIZE</text>

  <!-- node: send mail -->
  <g transform="translate(1000 380)">
    <rect width="140" height="140" rx="22" fill="#3a3a3a" stroke="#f2f2f2" stroke-width="2.5" filter="url(#glow)"/>
    <rect x="30" y="44" width="80" height="54" rx="6" fill="none" stroke="#ffffff" stroke-width="3.5"/>
    <path d="M32 48 L70 76 L108 48" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round"/>
    <circle cx="0" cy="70" r="8" fill="#070707" stroke="#d0d0d0" stroke-width="2"/>
  </g>
  <text x="1070" y="560" font-family="monospace" font-size="18" letter-spacing="2" fill="#a6a6a6" text-anchor="middle">SEND</text>

  <text x="60" y="90" font-family="sans-serif" font-weight="700" font-size="44" fill="#ededed">Auto Mail Workflow</text>
  <text x="60" y="130" font-family="monospace" font-size="18" letter-spacing="3" fill="#d0d0d0">n8n · AUTOMATION</text>
</svg>
